name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Choose version
        shell: pwsh
        run: |
          $version = '0.1.1'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') { throw 'Use a vMAJOR.MINOR.PATCH tag' }
            $version = $env:GITHUB_REF_NAME.Substring(1)
          }
          "USBPAL_VERSION=$version" >> $env:GITHUB_ENV
      - name: Build and regression tests
        shell: pwsh
        run: |
          ./build.ps1 -Version $env:USBPAL_VERSION
          $p = Start-Process "./bin/v$env:USBPAL_VERSION/USBPal.exe" -ArgumentList '--self-test' -WindowStyle Hidden -Wait -PassThru
          Get-Content "./bin/v$env:USBPAL_VERSION/test-result.txt"
          if ($p.ExitCode -ne 0) { throw 'Regression tests failed' }
      - name: Install packaging compiler if needed
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe")) { choco install innosetup --yes --no-progress; if ($LASTEXITCODE -ne 0) { throw 'Compiler installation failed' } }
      - name: Package per-user installer
        shell: pwsh
        run: ./package.ps1 -Version $env:USBPAL_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: USBPal-windows-x64
          path: dist/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: USBPal-windows-x64
          path: dist
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME ./dist/* --repo $env:GITHUB_REPOSITORY --verify-tag --title "USBPal $env:GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md

